<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Remote Control - Permission</title>

<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.container {
  max-width:450px;
  margin:auto;
}
h1 {
  color:#35b8ff;
  text-align:center;
}
.card {
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}
input,button {
  box-sizing:border-box;
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:9px;
  font-size:16px;
}
input {
  border:0;
}
button {
  border:0;
  background:#1689ff;
  color:white;
}
#ownerId {
  overflow-wrap:anywhere;
  color:#86efac;
}
.status {
  color:#facc15;
  text-align:center;
}
.note {
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>
<div class="container">

<h1>Device Permission</h1>

<div class="card">
<h2>Owner Login</h2>

<input id="email" type="email"
placeholder="Enter Email">

<input id="password" type="password"
placeholder="Enter Password">

<button id="loginBtn">Login</button>
<button id="logoutBtn">Logout</button>

<p id="status" class="status">Please login</p>
</div>

<div class="card">
<h2>Owner Information</h2>

<p>Owner ID:</p>
<p id="ownerId">Not available</p>

<button id="copyBtn">Copy Owner ID</button>

<p class="note">
Keep your account password private.
Owner ID is an account identifier, not a password.
</p>
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyC3cV-srYW3K6hzWPEQID_GNwMlntIcpnE",
authDomain: "smart-remote-control-589a1.firebaseapp.com",
databaseURL: "https://smart-remote-control-589a1-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "smart-remote-control-589a1",
storageBucket: "smart-remote-control-589a1.firebasestorage.app",
messagingSenderId: "627989413574",
appId: "1:627989413574:web:d93b68e22bcdb6f05061c7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const status = document.getElementById("status");
const ownerId = document.getElementById("ownerId");

document.getElementById("loginBtn")
.addEventListener("click", async () => {

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if (!email || !password) {
alert("Enter email and password");
return;
}

try {
await signInWithEmailAndPassword(auth,email,password);
status.innerText = "Login successful";
} catch(error) {
status.innerText = "Login failed: " + error.message;
}

});

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

try {
await signOut(auth);
} catch(error) {
status.innerText = error.message;
}

});

onAuthStateChanged(auth, (user) => {

if (user) {
status.innerText = "Owner logged in: " + user.email;
ownerId.innerText = user.uid;
} else {
status.innerText = "Please login";
ownerId.innerText = "Not available";
}

});

document.getElementById("copyBtn")
.addEventListener("click", async () => {

const user = auth.currentUser;

if (!user) {
alert("Please login first");
return;
}

try {
await navigator.clipboard.writeText(user.uid);
alert("Owner ID copied");
} catch(error) {
alert("Please select and copy the Owner ID manually");
}

});

</script>
</body>
</html>
