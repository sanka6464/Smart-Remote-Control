<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Permission</title>

<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.container {
  max-width:450px;
  margin:auto;
}
h1 {
  color:#35b8ff;
  text-align:center;
}
.card {
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}
button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  font-size:16px;
  color:white;
}
.approve { background:#16a34a; }
.reject { background:#dc2626; }
.revoke { background:#d97706; }
.status {
  color:#facc15;
  text-align:center;
}
</style>
</head>

<body>
<div class="container">

<h1>Device Permission</h1>

<div class="card">
<h2>Owner Permission</h2>

<p>Connection Request</p>

<p id="status" class="status">
No connection request
</p>

<button class="approve" id="approveBtn">
Approve
</button>

<button class="reject" id="rejectBtn">
Reject
</button>

<button class="revoke" id="revokeBtn">
Revoke Permission
</button>

<p style="color:#94a3b8;font-size:13px">
This is a demonstration screen.
No device access is active.
</p>
</div>

</div>

<script>
const status = document.getElementById("status");

document.getElementById("approveBtn").onclick = () => {
  status.innerText = "Demo: Permission Approved";
};

document.getElementById("rejectBtn").onclick = () => {
  status.innerText = "Demo: Request Rejected";
};

document.getElementById("revokeBtn").onclick = () => {
  status.innerText = "Demo: Permission Revoked";
};
</script>

</body>
</html>
