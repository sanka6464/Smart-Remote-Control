<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Remote Control</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
    padding: 25px;
}
.container {
    max-width: 400px;
    margin: auto;
}
h1 {
    color: #35b8ff;
}
.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
    margin-top: 25px;
}
input {
    padding: 12px;
    width: 80%;
    border-radius: 8px;
    border: none;
}
button {
    background: #1689ff;
    color: white;
    padding: 13px 25px;
    border: none;
    border-radius: 8px;
    margin-top: 15px;
    font-size: 16px;
}
</style>
</head>
<body>
<div class="container">
<h1>Smart Remote Control</h1>
<p>Welcome to Smart Remote Control</p>

<div class="card">
<h2>Connect Device</h2>
<p>Enter Connection PIN</p>
<input type="number" placeholder="Enter PIN">
<br>
<button onclick="connect()">Connect</button>
<p id="status"></p>
</div>

</div>

<script>
function connect() {
    document.getElementById("status").innerText =
    "Connection feature coming soon!";
}
</script>
</body>
</html>
