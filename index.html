<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Remote Control</title>

<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:15px;
}

.container {
  max-width:500px;
  margin:auto;
}

.card {
  background:#1e293b;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
}

h2 {
  color:#35b8ff;
  text-align:center;
}

input {
  width:100%;
  padding:12px;
  margin:8px 0;
  box-sizing:border-box;
  border-radius:7px;
  border:0;
}

button {
  padding:12px;
  margin:5px 0;
  width:100%;
  border:0;
  border-radius:7px;
  background:#1689ff;
  color:white;
  font-weight:bold;
}

.green { background:#159957; }
.red { background:#dc3545; }
.gray { background:#64748b; }

.status {
  color:#35b8ff;
  text-align:center;
  overflow-wrap:anywhere;
}

.small {
  font-size:13px;
  color:#cbd5e1;
  overflow-wrap:anywhere;
}

.count {
  font-size:28px;
  color:#35b8ff;
  text-align:center;
  font-weight:bold;
}

.permissionItem {
  background:#334155;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>

<div class="container">

<h2>Smart Remote Control</h2>

<div class="card" id="loginBox">

<h3>User Login</h3>

<input id="email" type="email"
placeholder="Email Address">

<input id="password" type="password"
placeholder="Password">

<button id="loginBtn">Login</button>

<button id="registerBtn" class="green">
Create Account
</button>

<p id="loginStatus" class="status"></p>

</div>

<div id="dashboard" style="display:none">

<div class="card">

<h3>My Device Account</h3>

<p class="small">Your UID:</p>

<p id="myUid" class="status"></p>

<button id="copyUidBtn" class="gray">
Copy My UID
</button>

<button id="logoutBtn" class="red">
Logout
</button>

</div>

<div class="card">

<h3>Approved Permissions Dashboard</h3>

<p class="small">
Number of approved permission requests:
</p>

<p id="approvedCount" class="count">0</p>

<div id="approvedDevices">
No approved permissions yet.
</div>

<p class="small">
This dashboard displays permission status only.
</p>

</div>

<div class="card">

<h3>Send Connection Request</h3>

<input id="ownerUid"
placeholder="Enter Device Owner UID">

<button id="sendRequestBtn">
Send Connection Request
</button>

<p id="requestStatus" class="status"></p>

</div>

<div class="card">

<h3>Incoming Requests</h3>

<div id="incomingRequests">
Waiting for requests...
</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";


const firebaseConfig = {
apiKey: "AIzaSyC3cV-srYW3K6hzWPEQID_GNwMlntIcpnE",
authDomain: "smart-remote-control-589a1.firebaseapp.com",
databaseURL: "https://smart-remote-control-589a1-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "smart-remote-control-589a1",
storageBucket: "smart-remote-control-589a1.firebasestorage.app",
messagingSenderId: "627989413574",
appId: "1:627989413574:web:d93b68e22bcdb6f05061c7"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let stopIncoming = null;
let stopRequestStatus = null;

const $ = id => document.getElementById(id);


// LOGIN

$("loginBtn").onclick = async () => {

try {

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

$("loginStatus").innerText = "Login Successful";

} catch(error) {

$("loginStatus").innerText = error.message;

}

};


// REGISTER

$("registerBtn").onclick = async () => {

try {

await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

$("loginStatus").innerText = "Account Created";

} catch(error) {

$("loginStatus").innerText = error.message;

}

};


// LOGOUT

$("logoutBtn").onclick = async () => {

await signOut(auth);

};


// AUTH CHECK

onAuthStateChanged(auth, user => {

currentUser = user;

if(user) {

$("loginBox").style.display = "none";
$("dashboard").style.display = "block";

$("myUid").innerText = user.uid;

listenIncomingRequests();

} else {

$("loginBox").style.display = "block";
$("dashboard").style.display = "none";

if(stopIncoming) stopIncoming();
if(stopRequestStatus) stopRequestStatus();

}

});


// COPY UID

$("copyUidBtn").onclick = async () => {

try {

await navigator.clipboard.writeText(currentUser.uid);

alert("UID Copied Successfully");

} catch(error) {

alert("Please copy the UID manually.");

}

};


// SEND REQUEST

$("sendRequestBtn").onclick = async () => {

const ownerUid = $("ownerUid").value.trim();

if(!ownerUid || ownerUid.length < 10) {

$("requestStatus").innerText =
"Please enter a valid Owner UID";

return;

}

if(ownerUid === currentUser.uid) {

$("requestStatus").innerText =
"You cannot send a request to yourself";

return;

}

try {

const requestsRef = ref(
db,
"requests/" + ownerUid
);

const newRequest = push(requestsRef);

const requestData = {

requesterUid: currentUser.uid,
ownerUid: ownerUid,
createdAt: Date.now(),
status: "pending"

};

await set(newRequest, requestData);

$("requestStatus").innerText =
"Connection Request Sent. Waiting for Owner Approval.";

if(stopRequestStatus) stopRequestStatus();

stopRequestStatus = onValue(
newRequest,
snapshot => {

if(snapshot.exists()) {

const status = snapshot.val().status;

$("requestStatus").innerText =
"Request Status: " + status.toUpperCase();

}

},
error => {

$("requestStatus").innerText =
"Status Error: " + error.message;

}
);

} catch(error) {

$("requestStatus").innerText =
"Request Failed: " + error.message;

}

};


// OWNER INCOMING REQUESTS

function listenIncomingRequests() {

if(stopIncoming) stopIncoming();

const requestsRef = ref(
db,
"requests/" + currentUser.uid
);

stopIncoming = onValue(
requestsRef,
snapshot => {

const box = $("incomingRequests");
const approvedBox = $("approvedDevices");

box.innerHTML = "";
approvedBox.innerHTML = "";

let approvedCount = 0;

if(!snapshot.exists()) {

box.innerText = "No Incoming Requests";
approvedBox.innerText = "No approved permissions yet.";

$("approvedCount").innerText = "0";

return;

}

snapshot.forEach(child => {

const requestId = child.key;
const data = child.val();


// APPROVED PERMISSIONS DASHBOARD

if(data.status === "approved") {

approvedCount++;

const item = document.createElement("div");
item.className = "permissionItem";

const uid = document.createElement("p");
uid.className = "small";
uid.textContent = "Approved UID: " + data.requesterUid;

const state = document.createElement("p");
state.className = "status";
state.textContent = "Permission: APPROVED";

item.append(uid, state);

approvedBox.appendChild(item);

}


// INCOMING REQUEST CARD

const card = document.createElement("div");
card.className = "card";

const title = document.createElement("h4");
title.textContent = "Connection Request";

const requester = document.createElement("p");
requester.className = "small";
requester.textContent =
"Requester UID: " + data.requesterUid;

const status = document.createElement("p");
status.className = "status";
status.textContent =
"Status: " + data.status;

card.append(title, requester, status);


if(data.status === "pending") {

const approve = document.createElement("button");
approve.className = "green";
approve.textContent = "Approve";

approve.onclick = () =>
changeStatus(requestId, "approved");

const reject = document.createElement("button");
reject.className = "red";
reject.textContent = "Reject";

reject.onclick = () =>
changeStatus(requestId, "rejected");

card.append(approve, reject);

}


if(data.status === "approved") {

const revoke = document.createElement("button");
revoke.className = "red";
revoke.textContent = "Revoke Permission";

revoke.onclick = () =>
changeStatus(requestId, "revoked");

card.append(revoke);

}

box.appendChild(card);

});

$("approvedCount").innerText = approvedCount;

if(approvedCount === 0) {

approvedBox.innerText =
"No approved permissions yet.";

}

},
error => {

$("incomingRequests").innerText =
"Database Error: " + error.message;

}
);

}


// CHANGE REQUEST STATUS

async function changeStatus(requestId, status) {

try {

const requestRef = ref(
db,
"requests/" + currentUser.uid + "/" + requestId
);

await update(requestRef, {
status: status
});

alert("Permission status updated: " + status);

} catch(error) {

alert("Update Failed: " + error.message);

}

}

</script>

</body>
</html>
