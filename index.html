<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Remote Control</title>

<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:15px;
}
.container {
  max-width:500px;
  margin:auto;
}
.card {
  background:#1e293b;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
}
h2 {
  color:#35b8ff;
  text-align:center;
}
input {
  width:100%;
  padding:12px;
  margin:8px 0;
  box-sizing:border-box;
  border-radius:7px;
  border:0;
}
button {
  padding:12px;
  margin:5px 0;
  width:100%;
  border:0;
  border-radius:7px;
  background:#1689ff;
  color:white;
  font-weight:bold;
}
.green {background:#159957;}
.red {background:#dc3545;}
.gray {background:#64748b;}
.status {
  color:#35b8ff;
  text-align:center;
  overflow-wrap:anywhere;
}
.small {
  font-size:13px;
  color:#cbd5e1;
  overflow-wrap:anywhere;
}
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat {
  background:#334155;
  padding:15px;
  border-radius:10px;
  text-align:center;
}
.count {
  font-size:30px;
  color:#35b8ff;
  font-weight:bold;
  margin:8px;
}
.permissionItem {
  background:#334155;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  overflow-wrap:anywhere;
}
.dot {
  display:inline-block;
  width:11px;
  height:11px;
  border-radius:50%;
  margin-right:8px;
}
.dotGreen {background:#22c55e;box-shadow:0 0 8px #22c55e;}
.dotYellow {background:#facc15;box-shadow:0 0 8px #facc15;}
.dotRed {background:#ef4444;box-shadow:0 0 8px #ef4444;}
</style>
</head>

<body>
<div class="container">

<h2>Smart Remote Control</h2>

<div class="card" id="loginBox">
<h3>User Login</h3>

<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>
<button id="registerBtn" class="green">Create Account</button>

<p id="loginStatus" class="status"></p>
</div>

<div id="dashboard" style="display:none">

<div class="card">
<h3>My Device Account</h3>
<p class="small">Your UID:</p>
<p id="myUid" class="status"></p>

<button id="copyUidBtn" class="gray">Copy My UID</button>
<button id="logoutBtn" class="red">Logout</button>

<p id="connectionStatus" class="status">
Connecting...
</p>
</div>

<div class="card">
<h3>Users Dashboard</h3>

<div class="grid">

<div class="stat">
<p>Total Users</p>
<div class="count" id="totalUsers">0</div>
</div>

<div class="stat">
<p>Online Users</p>
<div class="count" id="onlineUsers">0</div>
</div>

<div class="stat">
<p>Approved Users</p>
<div class="count" id="approvedCount">0</div>
</div>

<div class="stat">
<p>Pending Requests</p>
<div class="count" id="pendingCount">0</div>
</div>

</div>

<div class="stat" style="margin-top:10px">
<p>Revoked Permissions</p>
<div class="count" id="revokedCount">0</div>
</div>
</div>

<div class="card">
<h3>Approved Devices</h3>
<div id="approvedDevices">
Loading...
</div>
</div>

<div class="card">
<h3>Send Connection Request</h3>

<input id="ownerUid" placeholder="Enter Device Owner UID">

<button id="sendRequestBtn">Send Connection Request</button>

<p id="requestStatus" class="status"></p>
</div>

<div class="card">
<h3>Incoming Requests</h3>
<div id="incomingRequests">Loading...</div>
</div>

</div>
</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
set,
get,
onValue,
update,
onDisconnect
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";


const firebaseConfig = {
apiKey: "AIzaSyC3cV-srYW3K6hzWPEQID_GNwMlntIcpnE",
authDomain: "smart-remote-control-589a1.firebaseapp.com",
databaseURL: "https://smart-remote-control-589a1-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "smart-remote-control-589a1",
storageBucket: "smart-remote-control-589a1.firebasestorage.app",
messagingSenderId: "627989413574",
appId: "1:627989413574:web:d93b68e22bcdb6f05061c7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;

let stopListeners = [];

const $ = id => document.getElementById(id);


// LOGIN

$("loginBtn").onclick = async () => {
try {
await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);
$("loginStatus").innerText = "Login Successful";
} catch(error) {
$("loginStatus").innerText = error.message;
}
};


// REGISTER

$("registerBtn").onclick = async () => {
try {
await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);
$("loginStatus").innerText = "Account Created Successfully";
} catch(error) {
$("loginStatus").innerText = error.message;
}
};


// LOGOUT

$("logoutBtn").onclick = async () => {
await signOut(auth);
};


// AUTH CHECK

onAuthStateChanged(auth, async user => {

stopListeners.forEach(stop => stop());
stopListeners = [];

currentUser = user;

if(!user) {
$("loginBox").style.display = "block";
$("dashboard").style.display = "none";
return;
}

$("loginBox").style.display = "none";
$("dashboard").style.display = "block";

$("myUid").innerText = user.uid;

await startPresence(user);

startUserDashboard();
listenIncomingRequests();

});


// PRESENCE SYSTEM

async function startPresence(user) {

const uid = user.uid;

const userRef = ref(db, "users/" + uid);
const presenceRef = ref(db, "presence/" + uid);

try {

const oldUser = await get(userRef);

await set(userRef, {
uid: uid,
createdAt: oldUser.exists()
? oldUser.val().createdAt
: Date.now(),
lastSeen: Date.now()
});

await onDisconnect(presenceRef).set({
state: "offline",
lastChanged: Date.now()
});

await set(presenceRef, {
state: "online",
lastChanged: Date.now()
});

$("connectionStatus").innerHTML =
'<span class="dot dotGreen"></span>Connected';

} catch(error) {

$("connectionStatus").innerText =
"Connection Error: " + error.message;

}

}


// USERS DASHBOARD

function startUserDashboard() {

const usersRef = ref(db, "users");

const stopUsers = onValue(usersRef, snapshot => {

$("totalUsers").innerText =
snapshot.exists()
? Object.keys(snapshot.val()).length
: 0;

}, error => {
$("totalUsers").innerText = "Error";
});

stopListeners.push(stopUsers);


const presenceRef = ref(db, "presence");

const stopPresence = onValue(presenceRef, snapshot => {

let online = 0;

if(snapshot.exists()) {

snapshot.forEach(child => {

if(child.val().state === "online") {
online++;
}

});

}

$("onlineUsers").innerText = online;

}, error => {
$("onlineUsers").innerText = "Error";
});

stopListeners.push(stopPresence);

}


// SEND REQUEST

$("sendRequestBtn").onclick = async () => {

if(!currentUser) return;

const ownerUid = $("ownerUid").value.trim();

if(!ownerUid || ownerUid.length < 10) {
$("requestStatus").innerText = "Invalid Owner UID";
return;
}

if(ownerUid === currentUser.uid) {
$("requestStatus").innerText = "Cannot request yourself";
return;
}

try {

const requestRef = push(
ref(db, "requests/" + ownerUid)
);

await set(requestRef, {
requesterUid: currentUser.uid,
ownerUid: ownerUid,
createdAt: Date.now(),
status: "pending"
});

$("requestStatus").innerText =
"Connection Request Sent";

} catch(error) {

$("requestStatus").innerText =
"Request Failed: " + error.message;

}

};


// INCOMING REQUESTS

function listenIncomingRequests() {

const requestsRef = ref(
db,
"requests/" + currentUser.uid
);

const stop = onValue(requestsRef, snapshot => {

const box = $("incomingRequests");
const approvedBox = $("approvedDevices");

box.innerHTML = "";
approvedBox.innerHTML = "";

let grouped = new Map();

if(snapshot.exists()) {

snapshot.forEach(child => {

const data = child.val();

if(!data.requesterUid) return;

const uid = data.requesterUid;

if(!grouped.has(uid)) {
grouped.set(uid, []);
}

grouped.get(uid).push({
id: child.key,
data: data
});

});

}

let approved = 0;
let pending = 0;
let revoked = 0;

grouped.forEach((items, uid) => {

items.sort((a,b) =>
(b.data.updatedAt || b.data.createdAt || 0) -
(a.data.updatedAt || a.data.createdAt || 0)
);

const latest = items[0];
const status = latest.data.status;

const item = document.createElement("div");
item.className = "permissionItem";

const dot = document.createElement("span");
dot.className = "dot";

const title = document.createElement("p");
title.textContent = "Device UID: " + uid;

const label = document.createElement("p");
label.className = "small";

if(status === "approved") {
approved++;
dot.classList.add("dotGreen");
label.textContent = "APPROVED";
} else if(status === "pending") {
pending++;
dot.classList.add("dotYellow");
label.textContent = "PENDING";
} else {
if(status === "revoked") revoked++;
dot.classList.add("dotRed");
label.textContent = status.toUpperCase();
}

item.append(dot, title, label);

if(status === "approved") {

const revoke = document.createElement("button");
revoke.className = "red";
revoke.textContent = "Revoke Permission";

revoke.onclick = () =>
changeStatus(latest.id, "revoked");

item.appendChild(revoke);

approvedBox.appendChild(item.cloneNode(true));

}

if(status === "pending") {

const approve = document.createElement("button");
approve.className = "green";
approve.textContent = "Approve";

approve.onclick = () =>
changeStatus(latest.id, "approved");

const reject = document.createElement("button");
reject.className = "red";
reject.textContent = "Reject";

reject.onclick = () =>
changeStatus(latest.id, "rejected");

item.append(approve, reject);

}

box.appendChild(item);

});

$("approvedCount").innerText = approved;
$("pendingCount").innerText = pending;
$("revokedCount").innerText = revoked;

if(approved === 0) {
approvedBox.innerText = "No approved devices.";
}

if(grouped.size === 0) {
box.innerText = "No incoming requests.";
}

}, error => {

$("incomingRequests").innerText =
"Database Error: " + error.message;

});

stopListeners.push(stop);

}


// CHANGE STATUS

async function changeStatus(id, status) {

if(!confirm("Change permission to " + status + "?")) {
return;
}

try {

await update(
ref(db, "requests/" + currentUser.uid + "/" + id),
{
status: status,
updatedAt: Date.now()
}
);

alert("Permission updated successfully");

} catch(error) {

alert("Update Failed: " + error.message);

}

}


// COPY UID

$("copyUidBtn").onclick = async () => {

try {

await navigator.clipboard.writeText(currentUser.uid);
alert("UID Copied Successfully");

} catch(error) {

alert("Please copy UID manually: " + currentUser.uid);

}

};

</script>
</body>
</html>
