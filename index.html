<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Remote Control</title>

<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:15px;
}

.container {
  max-width:500px;
  margin:auto;
}

.card {
  background:#1e293b;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
}

h2 {
  color:#35b8ff;
  text-align:center;
}

input {
  width:100%;
  padding:12px;
  margin:8px 0;
  box-sizing:border-box;
  border-radius:7px;
  border:0;
}

button {
  padding:12px;
  margin:5px 0;
  width:100%;
  border:0;
  border-radius:7px;
  background:#1689ff;
  color:white;
  font-weight:bold;
}

.green { background:#159957; }
.red { background:#dc3545; }
.gray { background:#64748b; }

.status {
  color:#35b8ff;
  text-align:center;
  overflow-wrap:anywhere;
}

.small {
  font-size:13px;
  color:#cbd5e1;
  overflow-wrap:anywhere;
}

.count {
  font-size:28px;
  color:#35b8ff;
  text-align:center;
  font-weight:bold;
}

.permissionItem {
  background:#334155;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>

<div class="container">

<h2>Smart Remote Control</h2>

<div class="card" id="loginBox">

<h3>User Login</h3>

<input id="email" type="email"
placeholder="Email Address">

<input id="password" type="password"
placeholder="Password">

<button id="loginBtn">Login</button>

<button id="registerBtn" class="green">
Create Account
</button>

<p id="loginStatus" class="status"></p>

</div>

<div id="dashboard" style="display:none">

<div class="card">

<h3>My Device Account</h3>

<p class="small">Your UID:</p>

<p id="myUid" class="status"></p>

<button id="copyUidBtn" class="gray">
Copy My UID
</button>

<button id="logoutBtn" class="red">
Logout
</button>

</div>

<div class="card">

<h3>Approved Permissions Dashboard</h3>

<p class="small">
Number of approved users:
</p>

<p id="approvedCount" class="count">0</p>

<div id="approvedDevices">
No approved permissions yet.
</div>

<p class="small">
This dashboard displays permission status only.
</p>

</div>

<div class="card">

<h3>Send Connection Request</h3>

<input id="ownerUid"
placeholder="Enter Device Owner UID">

<button id="sendRequestBtn">
Send Connection Request
</button>

<p id="requestStatus" class="status"></p>

</div>

<div class="card">

<h3>Incoming Requests</h3>

<div id="incomingRequests">
Waiting for requests...
</div>

</div>

</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
set,
get,
onValue,
update
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";


const firebaseConfig = {
apiKey: "AIzaSyC3cV-srYW3K6hzWPEQID_GNwMlntIcpnE",
authDomain: "smart-remote-control-589a1.firebaseapp.com",
databaseURL: "https://smart-remote-control-589a1-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "smart-remote-control-589a1",
storageBucket: "smart-remote-control-589a1.firebasestorage.app",
messagingSenderId: "627989413574",
appId: "1:627989413574:web:d93b68e22bcdb6f05061c7"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let stopIncoming = null;
let stopRequestStatus = null;

const $ = id => document.getElementById(id);


// LOGIN

$("loginBtn").onclick = async () => {

try {

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

$("loginStatus").innerText = "Login Successful";

} catch(error) {

$("loginStatus").innerText = error.message;

}

};


// REGISTER

$("registerBtn").onclick = async () => {

try {

await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

$("loginStatus").innerText = "Account Created";

} catch(error) {

$("loginStatus").innerText = error.message;

}

};


// LOGOUT

$("logoutBtn").onclick = async () => {

await signOut(auth);

};


// AUTH CHECK

onAuthStateChanged(auth, user => {

currentUser = user;

if(user) {

$("loginBox").style.display = "none";
$("dashboard").style.display = "block";

$("myUid").innerText = user.uid;

listenIncomingRequests();

} else {

$("loginBox").style.display = "block";
$("dashboard").style.display = "none";

if(stopIncoming) stopIncoming();
if(stopRequestStatus) stopRequestStatus();

}

});


// COPY UID

$("copyUidBtn").onclick = async () => {

try {

await navigator.clipboard.writeText(currentUser.uid);

alert("UID Copied Successfully");

} catch(error) {

alert("Please copy the UID manually.");

}

};


// SEND REQUEST - DUPLICATE CHECK

$("sendRequestBtn").onclick = async () => {

if(!currentUser) return;

const ownerUid = $("ownerUid").value.trim();

if(!ownerUid || ownerUid.length < 10) {

$("requestStatus").innerText =
"Please enter a valid Owner UID";

return;

}

if(ownerUid === currentUser.uid) {

$("requestStatus").innerText =
"You cannot send a request to yourself";

return;

}

try {

const requestsRef = ref(
db,
"requests/" + ownerUid
);

const existing = await get(requestsRef);

let alreadyPending = false;
let alreadyApproved = false;

if(existing.exists()) {

existing.forEach(child => {

const data = child.val();

if(data.requesterUid === currentUser.uid) {

if(data.status === "pending") {
alreadyPending = true;
}

if(data.status === "approved") {
alreadyApproved = true;
}

}

});

}

if(alreadyApproved) {

$("requestStatus").innerText =
"Permission already approved.";

return;

}

if(alreadyPending) {

$("requestStatus").innerText =
"Request already pending. Please wait for approval.";

return;

}

const newRequest = push(requestsRef);

await set(newRequest, {

requesterUid: currentUser.uid,
ownerUid: ownerUid,
createdAt: Date.now(),
status: "pending"

});

$("requestStatus").innerText =
"Connection Request Sent.";

if(stopRequestStatus) stopRequestStatus();

stopRequestStatus = onValue(
newRequest,
snapshot => {

if(snapshot.exists()) {

$("requestStatus").innerText =
"Request Status: " +
snapshot.val().status.toUpperCase();

}

}
);

} catch(error) {

$("requestStatus").innerText =
"Request Failed: " + error.message;

}

};


// OWNER INCOMING REQUESTS

function listenIncomingRequests() {

if(stopIncoming) stopIncoming();

const requestsRef = ref(
db,
"requests/" + currentUser.uid
);

stopIncoming = onValue(
requestsRef,
snapshot => {

const box = $("incomingRequests");
const approvedBox = $("approvedDevices");

box.innerHTML = "";
approvedBox.innerHTML = "";

if(!snapshot.exists()) {

box.innerText = "No Incoming Requests";

approvedBox.innerText =
"No approved permissions yet.";

$("approvedCount").innerText = "0";

return;

}


// GROUP REQUESTS BY UID

const grouped = new Map();

snapshot.forEach(child => {

const data = child.val();
const requestId = child.key;

if(!data.requesterUid) return;

if(!grouped.has(data.requesterUid)) {

grouped.set(data.requesterUid, []);

}

grouped.get(data.requesterUid).push({

id: requestId,
data: data

});

});


let approvedCount = 0;


// DISPLAY UNIQUE APPROVED USERS

grouped.forEach((requests, uid) => {

const approvedRequests = requests.filter(
item => item.data.status === "approved"
);

if(approvedRequests.length > 0) {

approvedCount++;

const item = document.createElement("div");
item.className = "permissionItem";

const uidText = document.createElement("p");
uidText.className = "small";
uidText.textContent = "Approved UID: " + uid;

const state = document.createElement("p");
state.className = "status";
state.textContent = "Permission: APPROVED";

item.append(uidText, state);

approvedBox.appendChild(item);

}

});

$("approvedCount").innerText = approvedCount;

if(approvedCount === 0) {

approvedBox.innerText =
"No approved permissions yet.";

}


// DISPLAY ONE CARD PER UID

grouped.forEach((requests, uid) => {

const approved = requests.some(
item => item.data.status === "approved"
);

const pending = requests.some(
item => item.data.status === "pending"
);

const rejected = requests.some(
item => item.data.status === "rejected"
);

const card = document.createElement("div");
card.className = "permissionItem";

const title = document.createElement("h4");
title.textContent = "Connection Request";

const requester = document.createElement("p");
requester.className = "small";
requester.textContent = "Requester UID: " + uid;

const status = document.createElement("p");
status.className = "status";

if(approved) {

status.textContent = "Status: APPROVED";

} else if(pending) {

status.textContent = "Status: PENDING";

} else if(rejected) {

status.textContent = "Status: REJECTED";

} else {

status.textContent = "Status: REVOKED";

}

card.append(title, requester, status);


if(!approved && pending) {

const approve = document.createElement("button");

approve.className = "green";
approve.textContent = "Approve";

approve.onclick = () =>
changeGroupStatus(requests, "approved");

const reject = document.createElement("button");

reject.className = "red";
reject.textContent = "Reject";

reject.onclick = () =>
changeGroupStatus(requests, "rejected");

card.append(approve, reject);

}


if(approved) {

const revoke = document.createElement("button");

revoke.className = "red";
revoke.textContent = "Revoke Permission";

revoke.onclick = () =>
changeGroupStatus(requests, "revoked");

card.append(revoke);

}

box.appendChild(card);

});

},
error => {

$("incomingRequests").innerText =
"Database Error: " + error.message;

}
);

}


// CHANGE ALL DUPLICATE REQUESTS

async function changeGroupStatus(requests, status) {

if(!confirm("Are you sure you want to " + status + "?")) {
return;
}

try {

const changes = requests.map(item => {

const requestRef = ref(
db,
"requests/" + currentUser.uid + "/" + item.id
);

return update(requestRef, {
status: status,
updatedAt: Date.now()
});

});

await Promise.all(changes);

alert("Permission status updated: " + status);

} catch(error) {

alert("Update Failed: " + error.message);

}

}

</script>

</body>
</html>
