<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Remote Control</title>

<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.container {
  max-width:450px;
  margin:auto;
}
h1 {
  color:#35b8ff;
  text-align:center;
}
.card {
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}
input,button {
  box-sizing:border-box;
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:9px;
  font-size:16px;
}
input { border:0; }
button {
  border:0;
  background:#1689ff;
  color:white;
}
.reject {
  background:#dc3545;
}
.status {
  color:#facc15;
  text-align:center;
  overflow-wrap:anywhere;
}
.request {
  background:#334155;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  overflow-wrap:anywhere;
}
.note {
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>
<div class="container">

<h1>Smart Remote Control</h1>

<div class="card">
<h2>User Login</h2>

<input id="email" type="email" placeholder="Enter Email">
<input id="password" type="password" placeholder="Enter Password">

<button id="loginBtn">Login</button>
<button id="logoutBtn">Logout</button>

<p id="authStatus" class="status">Checking account...</p>
</div>

<div class="card">
<h2>Connection Request</h2>

<input id="ownerId" placeholder="Enter Device Owner UID">

<button id="requestBtn">Send Connection Request</button>
<button id="disconnectBtn">Disconnect</button>

<p id="status" class="status">Please login first</p>

<p class="note">
Connection requires explicit device owner approval.
</p>
</div>

<div class="card">
<h2>Device Owner Panel</h2>

<p class="note">
Connection requests sent to your account will appear here.
</p>

<div id="requestList">
<p class="status">Waiting for requests...</p>
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyC3cV-srYW3K6hzWPEQID_GNwMlntIcpnE",
authDomain: "smart-remote-control-589a1.firebaseapp.com",
databaseURL: "https://smart-remote-control-589a1-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "smart-remote-control-589a1",
storageBucket: "smart-remote-control-589a1.firebasestorage.app",
messagingSenderId: "627989413574",
appId: "1:627989413574:web:d93b68e22bcdb6f05061c7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

let currentUser = null;
let stopOwnerListener = null;
let stopRequestListener = null;

const status = document.getElementById("status");
const authStatus = document.getElementById("authStatus");
const requestList = document.getElementById("requestList");

document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Enter email and password");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth,email,password);
    authStatus.innerText = "Login successful";
  } catch(error) {
    authStatus.innerText = "Login failed: " + error.message;
  }
};

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
};

onAuthStateChanged(auth, (user) => {

  currentUser = user;

  if (stopOwnerListener) {
    stopOwnerListener();
    stopOwnerListener = null;
  }

  if (stopRequestListener) {
    stopRequestListener();
    stopRequestListener = null;
  }

  if (user) {

    authStatus.innerText = "Logged in: " + user.email;

    const ownerRef = ref(database, "requests/" + user.uid);

    stopOwnerListener = onValue(ownerRef, (snapshot) => {

      requestList.replaceChildren();

      if (!snapshot.exists()) {
        requestList.innerText = "No connection requests yet.";
        return;
      }

      snapshot.forEach((item) => {

        const data = item.val();

        const box = document.createElement("div");
        box.className = "request";

        const info = document.createElement("p");
        info.textContent = "Requester UID: " + data.requesterUid;

        const state = document.createElement("p");
        state.textContent = "Status: " + data.status;

        box.append(info, state);

        if (data.status === "pending") {

          const accept = document.createElement("button");
          accept.textContent = "Accept Request";

          accept.onclick = async () => {
            try {
              await update(ref(database,
                "requests/" + user.uid + "/" + item.key),
                {status: "approved"}
              );
            } catch(error) {
              alert("Approval failed: " + error.message);
            }
          };

          const reject = document.createElement("button");
          reject.textContent = "Reject Request";
          reject.className = "reject";

          reject.onclick = async () => {
            try {
              await update(ref(database,
                "requests/" + user.uid + "/" + item.key),
                {status: "rejected"}
              );
            } catch(error) {
              alert("Rejection failed: " + error.message);
            }
          };

          box.append(accept, reject);
        }

        requestList.appendChild(box);
      });
    });

  } else {

    authStatus.innerText = "Please login";
    status.innerText = "Please login first";
    requestList.innerText = "Please login to view requests.";

  }
});

document.getElementById("requestBtn").onclick = async () => {

  if (!currentUser) {
    alert("Please login first");
    return;
  }

  const ownerUid = document.getElementById("ownerId").value.trim();

  if (!ownerUid) {
    alert("Please enter Owner ID");
    return;
  }

  if (ownerUid.length > 128 || ownerUid === currentUser.uid) {
    alert("Invalid Owner ID");
    return;
  }

  try {

    const requestsRef = ref(database, "requests/" + ownerUid);
    const newRequest = push(requestsRef);

    await set(newRequest, {
      requesterUid: currentUser.uid,
      ownerUid: ownerUid,
      createdAt: Date.now(),
      status: "pending"
    });

    status.innerText = "Request sent. Waiting for owner approval.";

    if (stopRequestListener) stopRequestListener();

    stopRequestListener = onValue(newRequest, (snapshot) => {

      if (snapshot.exists()) {
        const data = snapshot.val();
        status.innerText = "Connection status: " + data.status;
      }

    });

  } catch(error) {

    status.innerText = "Request failed: " + error.message;

  }
};

document.getElementById("disconnectBtn").onclick = () => {

  if (stopRequestListener) {
    stopRequestListener();
    stopRequestListener = null;
  }

  status.innerText = "Disconnected";
  document.getElementById("ownerId").value = "";

};

</script>
</body>
</html>
